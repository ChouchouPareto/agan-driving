<svg viewBox="0 0 1200 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">阿甘学车最终产品蓝图</title>
  <desc id="desc">从学员档案与目标出发，由超级驾陪识别需求，连接学习、陪伴、服务和校长人工协同，最终形成个性化学车闭环。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-alert" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <style>
      text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}.title{fill:#f8fafc;font-size:24px;font-weight:700}.subtitle{fill:#94a3b8;font-size:12px}.node-title{fill:#f8fafc;font-size:14px;font-weight:700;text-anchor:middle}.node-sub{fill:#94a3b8;font-size:10px;text-anchor:middle}.lane{fill:#cbd5e1;font-size:11px;font-weight:600;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="920" fill="#0f172a"/><rect width="1200" height="920" fill="url(#grid)"/>
  <text x="50" y="48" class="title">阿甘学车｜从答题工具到全程学车伙伴</text>
  <text x="50" y="73" class="subtitle">一个懂学员、懂驾考、懂陪伴，并能与驾校真人服务协同的 AI 学车产品</text>

  <rect x="45" y="105" width="1110" height="110" rx="14" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="7,5"/><text x="63" y="129" class="lane">学员与目标</text>
  <line x1="360" y1="161" x2="470" y2="161" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/><line x1="730" y1="161" x2="840" y2="161" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <g><rect x="90" y="137" width="270" height="56" rx="28" fill="#0f172a"/><rect x="90" y="137" width="270" height="56" rx="28" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/><text x="225" y="160" class="node-title">学员档案</text><text x="225" y="177" class="node-sub">准驾车型·当前科目·学习进度</text></g>
  <g><rect x="470" y="137" width="260" height="56" rx="8" fill="#0f172a"/><rect x="470" y="137" width="260" height="56" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="600" y="160" class="node-title">学员当下需求</text><text x="600" y="177" class="node-sub">想学·看不懂·焦虑·办事·求助</text></g>
  <g><rect x="840" y="137" width="270" height="56" rx="28" fill="#0f172a"/><rect x="840" y="137" width="270" height="56" rx="28" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/><text x="975" y="160" class="node-title">学车目标</text><text x="975" y="177" class="node-sub">看懂·练会·通过·安心拿证</text></g>
  <line x1="600" y1="215" x2="600" y2="270" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

