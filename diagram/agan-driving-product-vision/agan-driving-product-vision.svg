  <g><rect x="75" y="430" width="230" height="74" rx="8" fill="#0f172a"/><rect x="75" y="430" width="230" height="74" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="190" y="459" class="node-title">普通聊天与焦虑疏导</text><text x="190" y="479" class="node-sub">像学车伙伴一样聊、听和陪伴</text></g>
  <g><rect x="345" y="430" width="230" height="74" rx="8" fill="#0f172a"/><rect x="345" y="430" width="230" height="74" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="460" y="459" class="node-title">刷题与学习辅导</text><text x="460" y="479" class="node-sub">题库·错题·口诀·模考·个性化计划</text></g>
  <g><rect x="625" y="430" width="230" height="74" rx="8" fill="#0f172a"/><rect x="625" y="430" width="230" height="74" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="740" y="459" class="node-title">专业知识与实践建议</text><text x="740" y="479" class="node-sub">科一至科四·驾驶技巧·安全知识</text></g>
