  <g><rect x="455" y="305" width="290" height="64" rx="10" fill="#0f172a"/><rect x="455" y="305" width="290" height="64" rx="10" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/><text x="600" y="331" class="node-title">意图识别与对话管理</text><text x="600" y="350" class="node-sub">先听懂学员在说什么，再选择最合适的帮助</text></g>
