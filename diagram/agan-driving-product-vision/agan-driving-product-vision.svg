  <rect x="175" y="814" width="850" height="70" rx="35" fill="#0f172a"/><rect x="175" y="814" width="850" height="70" rx="35" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/><text x="600" y="842" class="node-title">个性化学车闭环</text><text x="600" y="862" class="node-sub">学得会·考得过·心里稳·服务顺，并为驾校带来口碑、续费与转介绍</text>
