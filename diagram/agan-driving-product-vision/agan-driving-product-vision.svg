  <line x1="190" y1="504" x2="190" y2="550" stroke="#64748b" stroke-width="1.5"/><line x1="460" y1="504" x2="460" y2="550" stroke="#64748b" stroke-width="1.5"/><line x1="740" y1="504" x2="740" y2="550" stroke="#64748b" stroke-width="1.5"/><line x1="1010" y1="504" x2="1010" y2="550" stroke="#64748b" stroke-width="1.5"/><line x1="190" y1="550" x2="1010" y2="550" stroke="#64748b" stroke-width="1.5"/><line x1="600" y1="550" x2="600" y2="575" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(600 579)"><polygon points="0,-29 58,0 0,29 -58,0" fill="#0f172a"/><polygon points="0,-29 58,0 0,29 -58,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/><text y="4" class="node-title" font-size="11">可靠回答？</text></g>
  <line x1="600" y1="608" x2="600" y2="660" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/><text x="612" y="635" fill="#34d399" font-size="9">是</text><path d="M658 579 H960 V660" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-alert)"/><text x="790" y="570" fill="#fb7185" font-size="9">低置信度 / 特殊风险</text>

  <rect x="45" y="660" width="1110" height="115" rx="14" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="7,5"/><text x="63" y="684" class="lane">知识、工具与人工协同</text>
  <g><rect x="105" y="700" width="245" height="54" rx="8" fill="#0f172a"/><rect x="105" y="700" width="245" height="54" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="228" y="723" class="node-title">RAG 权威知识库</text><text x="228" y="740" class="node-sub">题库·法规·政策·驾校资料·来源</text></g>
  <g><rect x="478" y="700" width="245" height="54" rx="8" fill="#0f172a"/><rect x="478" y="700" width="245" height="54" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="600" y="723" class="node-title">学员进度与评估工具</text><text x="600" y="740" class="node-sub">做题·掌握度·错因·焦虑·下一步</text></g>
