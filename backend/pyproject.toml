[project]
name = "driving-school-assistant"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "pillow>=11,<12",
  "python-multipart>=0.0.20,<1",
  "chromadb>=1.0,<2",
  "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
